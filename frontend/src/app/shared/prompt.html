<form
  class="dialog prompt"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="options.title"
  (submit)="$event.preventDefault(); submit(input.value)"
>
  <header>
    <h2>{{ options.title }}</h2>
  </header>
  <div class="body">
    <label class="field"
      >{{ options.label }}
      <input
        #input
        class="input"
        [value]="options.value ?? ''"
        [placeholder]="options.placeholder ?? ''"
        spellcheck="false"
        autocomplete="off"
        dmAutofocus
      />
    </label>
  </div>
  <footer>
    <span class="spacer"></span>
    <button class="btn" type="button" (click)="dialogRef.close(null)">Cancel</button>
    <button class="btn primary" type="submit">{{ options.confirmLabel || 'OK' }}</button>
  </footer>
</form>
