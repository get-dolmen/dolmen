# Builds Dolmen for macOS, Linux and Windows.
#
# - Every push and pull request: tests, then a build per platform (downloadable
#   from the run's "Artifacts").
# - Pushing a tag like v1.2.3: the same builds are attached to a GitHub release,
#   which the in-app "check for updates" button reads.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx ng test --watch=false

      - name: Go tests
        run: |
          # main embeds frontend/dist; the tests do not need the real bundle.
          mkdir -p frontend/dist && touch frontend/dist/.keep
          go vet ./...
          go test ./...

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            task: darwin:package:universal
            artifact: macos-universal
          - name: Linux
            os: ubuntu-24.04
            task: linux:build
            artifact: linux-amd64
          - name: Windows
            os: windows-latest
            # Builds dolmen.exe, then the NSIS installer around it.
            task: windows:package
            artifact: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          # NSIS is not part of the windows-latest image, so install it with Chocolatey.
          if ! command -v makensis >/dev/null 2>&1; then
            choco install nsis --yes --no-progress
          fi
          nsis_dir="/c/Program Files (x86)/NSIS"
          nsis_dir_win='C:\Program Files (x86)\NSIS'
          if [ ! -d "$nsis_dir" ]; then
            nsis_dir="/c/Program Files/NSIS"
            nsis_dir_win='C:\Program Files\NSIS'
          fi
          if [ ! -x "$nsis_dir/makensis.exe" ]; then
            echo "NSIS (makensis) is not installed" >&2
            exit 1
          fi
          echo "$nsis_dir_win" >> "$GITHUB_PATH"
          export PATH="$nsis_dir:$PATH"
          # Git Bash rewrites "/VERSION" into a Windows path, so disable that.
          MSYS_NO_PATHCONV=1 makensis /VERSION

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          # Numeric x.y.z for the macOS bundle / Windows file version.
          numeric="$(echo "${version#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "Building $version ($numeric)"

      - name: Stamp version into the build assets
        run: |
          numeric="${{ steps.version.outputs.numeric }}"
          # macOS bundle version.
          sed -i.bak -E "/<key>CFBundle(Short)?VersionString<\/key>|<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>${numeric}</string>|;}" build/darwin/Info.plist
          # Windows file version resource and NSIS installer metadata.
          jq --arg v "$numeric" '.fixed.file_version = $v | .fixed.product_version = $v | .info["0409"].FileVersion = $v | .info["0409"].ProductVersion = $v' \
            build/windows/info.json > build/windows/info.tmp.json
          mv build/windows/info.tmp.json build/windows/info.json
          sed -i.bak -E "s|(define INFO_PRODUCTVERSION )\"[^\"]*\"|\1\"${numeric}\"|" build/windows/nsis/wails_tools.nsh
          rm -f build/darwin/Info.plist.bak build/windows/nsis/wails_tools.nsh.bak
          grep -A1 VersionString build/darwin/Info.plist
          grep INFO_PRODUCTVERSION build/windows/nsis/wails_tools.nsh

      - name: Build
        run: |
          # The platform Taskfiles already strip (-s -w) and trim paths.
          ldflags="-X main.version=${{ steps.version.outputs.version }} -X main.repo=${{ github.repository }} -X main.commit=${GITHUB_SHA}"
          wails3 task "${{ matrix.task }}" LDFLAGS="$ldflags"

      - name: Package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              name="dolmen-${version}-macos-universal.zip"
              ditto -c -k --keepParent bin/dolmen.app "dist/$name"
              ;;
            Linux)
              name="dolmen-${version}-linux-amd64.tar.gz"
              tar -C bin -czf "dist/$name" dolmen
              ;;
            Windows)
              name="dolmen-${version}-windows-amd64.zip"
              (cd bin && 7z a -tzip "../dist/$name" dolmen.exe > /dev/null)
              installer=$(ls bin/*-installer.exe 2>/dev/null | head -n 1)
              if [[ -z "$installer" ]]; then
                echo "the NSIS installer was not produced" >&2
                exit 1
              fi
              cp "$installer" "dist/dolmen-${version}-windows-amd64-setup.exe"
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dolmen-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v1.2.3-rc.1 and similar are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
