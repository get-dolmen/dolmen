<div class="dialog confirm" role="alertdialog" aria-modal="true" [attr.aria-label]="options.title || 'Confirm'">
  <header><h2>{{ options.title || 'Confirm' }}</h2></header>
  <div class="body"><p class="message">{{ options.message }}</p></div>
  <footer>
    <span class="spacer"></span>
    <button class="btn" type="button" (click)="dialogRef.close(false)">{{ options.cancelLabel || 'Cancel' }}</button>
    <button class="btn" type="button" [class.danger]="options.danger" [class.primary]="!options.danger"
            (click)="dialogRef.close(true)">{{ options.confirmLabel || 'Confirm' }}</button>
  </footer>
</div>
